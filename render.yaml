services:
  - type: web
    name: ldb-vehicle-tracking
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: APP_ACCESS_CODE
        sync: false
      - key: POLL_INTERVAL_SECONDS
        value: "60"
      - key: LDB_API_URL
        value: https://ldb.co.in/api/ldbv2/truck/search

